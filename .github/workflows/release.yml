name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # docker-build.sh runs every gate before it cross-compiles: the vendored
      # DSP is byte-compared against upstream, the parameter table against
      # 4K EQ 2's own, module.json against the C table, help.json against the
      # pages, and the native loadtest must pass. A red gate fails the release
      # rather than publishing a tarball nobody checked.
      - name: Build module (docker, aarch64 cross)
        run: |
          docker build -t four-k-eq-builder -f scripts/Dockerfile scripts/
          docker run --rm -v "$PWD:/build" -u "$(id -u):$(id -g)" -w /build \
            four-k-eq-builder ./scripts/docker-build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/4k-eq-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 - "$VERSION" <<'PY'
          import json, sys
          v = sys.argv[1]
          with open("release.json") as f:
              r = json.load(f)
          r["version"] = v
          r["download_url"] = ("https://github.com/athousanddetails/schwung-4keq"
                               f"/releases/download/v{v}/4k-eq-module.tar.gz")
          with open("release.json", "w") as f:
              json.dump(r, f, indent=2)
              f.write("\n")
          PY
          git add release.json
          git commit -m "release.json: v${VERSION}" || exit 0
          git push origin main
